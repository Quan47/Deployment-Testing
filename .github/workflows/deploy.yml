name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: 172.31.28.54
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install dependencies
            sudo apt-get update
            sudo apt-get install -y <dependencies>

            # Stop the existing application
            sudo systemctl stop translate-server

            # Pull the latest code
            git clone git@github.com:Quan47/Deployment-Testing.git

            # Build and install the application
            cd translate-server
            npm install
            npm run build

            # Start the application
            sudo systemctl start translate-server